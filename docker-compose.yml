services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-timetowork}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timetowork}
      POSTGRES_DB: ${POSTGRES_DB:-timetowork}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Bound to this machine only: published on every interface, anyone on the network could
    # reach the database with the default credentials.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timetowork}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-timetowork}:${POSTGRES_PASSWORD:-timetowork}@db:5432/${POSTGRES_DB:-timetowork}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PORT: 4000
      APP_URL: ${APP_URL:-http://localhost:8080}
      DEV_MODE: ${DEV_MODE:-false}
      # Only behind a reverse proxy: see the comment in backend/src/app.ts
      TRUST_PROXY: ${TRUST_PROXY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    # Loopback only (see the database above); DEV_MODE would otherwise let the whole network log in as anyone
    ports:
      - "127.0.0.1:4000:4000"

  # Regular backups of the database into ./backups (see backup/backup.sh and the guide).
  # Same image as the database, so pg_dump always matches its version.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-timetowork}
      PGPASSWORD: ${POSTGRES_PASSWORD:-timetowork}
      PGDATABASE: ${POSTGRES_DB:-timetowork}
      BACKUP_INTERVAL_MINUTES: ${BACKUP_INTERVAL_MINUTES:-1440}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_MIN: ${BACKUP_KEEP_MIN:-3}
    volumes:
      - ./backups:/backups
      - ./backup:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    command: ["run"]
    # "unhealthy" in `docker compose ps` = no recent backup (the database is down, the disk is full...)
    healthcheck:
      test: ["CMD", "/bin/sh", "/scripts/backup.sh", "health"]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 3m

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"

volumes:
  db_data:
